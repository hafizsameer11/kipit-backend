name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Assemble runtime folder
        run: |
          mkdir -p release
          cp -r dist prisma package.json package-lock.json release/
          cp scripts/backend-start.sh release/start.sh
          chmod +x release/start.sh
          cd release
          npm ci --omit=dev
          npx prisma generate
      - run: tar -C release -czf release.tar.gz .
      - name: Upload and deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes release.tar.gz "$USER@$HOST:/home/deploy/incoming/backend.tar.gz"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$USER@$HOST" "/usr/local/bin/deploy backend"
