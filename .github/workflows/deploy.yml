name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API + worker to VPS
    runs-on: ubuntu-latest
    # Set repository variable ENABLE_AUTO_DEPLOY=true after VPS secrets exist.
    if: ${{ vars.ENABLE_AUTO_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.BACKEND_DEPLOY_PATH }}"
            bash scripts/deploy.sh
